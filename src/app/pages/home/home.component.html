<nz-layout style="min-height: 100vh;">
<nz-sider #siderRef nzCollapsible [(nzCollapsed)]="isCollapsed" [nzTrigger]="null" [nzBreakpoint]="'lg'" [nzCollapsedWidth]="0">

    <div style="display: flex; align-items: center; justify-content: center;">
      <img src="logo.jpg" alt="Agromation Logo" style="width: 50px; height: auto; margin-right: 10px;border-radius: 80%;">
      <h2 style="color: white; margin: 0;">Agromation</h2>
    </div>

    <ul nz-menu nzTheme="dark" nzMode="inline">
      <li nz-menu-item routerLink="maindashboard" routerLinkActive="ant-menu-item-selected">
        <span nz-icon nzType="dashboard"></span>
        <span>Dashboard</span>
      </li>

<nz-card nzTitle="Device Names" nzBordered="true" style="margin-top: 12px;">

  <ul class="device-list">
    <li *ngFor="let device of devices" style="cursor: pointer; margin-left: -30px;">
      <span nz-icon nzType="tablet" style="margin-right: 8px;"></span>
                  <div style="font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">

      <a (click)="goToDashboard(device.id)">      

      {{ device.deviceName || device.name }}
      </a>
      </div>
    </li>
     </ul>
</nz-card>


    <ul nz-menu nzTheme="dark" nzMode="inline">

        <span nz-icon nzType="user"></span>
        <span title="Logout" (click)="logout()">LogOut</span>
      </li>
    </ul>

  </nz-sider>

  <nz-layout>
    <nz-header style="background: #fff; padding: 0;">
      <span
        class="trigger"
        style="font-size: 20px; padding: 0 24px; cursor: pointer;"
        (click)="isCollapsed = !isCollapsed"
      >
        <i nz-icon [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'"></i>
      </span>

      <!-- Title only shows when not on mobile with collapsed sidebar -->
      <span class="page-title" [ngClass]="{ 'hide-on-mobile': !isCollapsed }">
        Tank Level Monitoring System
      </span>

      <!-- Your content layout here -->
      <span [ngClass]="{ 'hide-on-mobile': !isCollapsed }">
        <span style="cursor: pointer;float: right;margin-right: 20px;"  title="Logout" (click)="logout()">
          <span style="font-weight: bold;margin-left: 10px">{{username}}</span>
          <i nz-icon nzType="user"nzTheme="outline" style="font-size: 20px;"></i>
        </span>
      </span>
    </nz-header>

    <nz-content style="margin-top: 5px; padding: 24px; background: #fff; min-height: 280px;">
      <router-outlet></router-outlet>
    </nz-content>

    <nz-footer style="text-align: center; padding: 1px 0 ; line-height: 30px; font-size: 15px;;">
      <span>Copyright © 2025 Agromation India All rights reserved.</span>
    </nz-footer>
  </nz-layout>
