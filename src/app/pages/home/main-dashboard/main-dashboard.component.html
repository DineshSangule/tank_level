
<div class="dashboard-container">
  <div class="card-grid">
    <ng-container *ngIf="isLoaded">
      <ng-container *ngFor="let device of devices | orderByOnline:data">

  <nz-card
    class="dashboard-card"
    [nzHoverable]="true"
    (click)="data[device.id] && openDevice(device.id)"
  >
<span nz-tooltip [nzTooltipTitle]="'' + (device.uuid || 'no')"   
>  

          <ng-container>
            <div
              style="padding: 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;"
              [ngClass]="{
                'card-title-on': data[device.id]?.do !== undefined,
                'card-title-off': data[device.id]?.do == undefined
              }"
            >
              <!-- Left side: Device Info -->
              <div>
                <div
                  style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 135px;"
                >
                  {{ device.name }}
                </div>
                
                <div style="font-size: 12px; color: black;">{{ device.area }}</div>
              </div>

              <!-- Right side: Status -->
              <div style="display: flex; align-items: center; gap: 6px;">
                <span
                  class="status-dot"
                  [ngStyle]="{
                    width: '10px',
                    height: '10px',
                    borderRadius: '50%',
                    display: 'inline-block',
                    backgroundColor: data[device.id]?.do !== undefined ? 'green' : 'red'
                  }"
                ></span>
                <span style="font-size: 13px;">
                  {{ data[device.id]?.do !== undefined ? 'Online' : 'Offline' }}
                </span>
              </div>
            </div>
          </ng-container>
          </span>

          <ng-container *ngIf="data[device.id]">
            <div class="card-content">
              <div class="tank-container">
                <div class="tank">
                  <!-- Show spinner if level is undefined -->
                  <ng-container *ngIf="data[device.id]?.level === undefined; else tankLevel">
                    <div
                      class="water"
                      style="height: 100%; display: flex; align-items: center; justify-content: center; background-color: #edf2f7;"
                    >
                      <nz-spin nzSimple></nz-spin><br />
                    </div>
                  </ng-container>

                  <!-- Show water level if data is available -->
                  <ng-template #tankLevel>
                    <div class="water" [style.height.%]="data[device.id]?.level">
                      <div class="inside-label">{{ data[device.id]?.level }}%</div>
                    </div>
                  </ng-template>
                </div>

                <div
                  class="status-label"
                  [ngClass]="{
                    on: data[device.id]?.pumpStatus,
                    off: !data[device.id]?.pumpStatus
                  }"
                >
                  Motor {{ data[device.id]?.pumpStatus ? 'ON' : 'OFF' }}
                </div>
              </div>

              <div class="divider"></div>

              <div class="info-box">
                <div *ngFor="let sw of [0, 1, 2]">
                  <!-- Label -->
                  <span
                    class="switch-label"
                    [ngStyle]="{
                      backgroundColor: data[device.id]?.do?.[sw] ? '#4caf50' : '#8898aa'
                    }"
                  >
                    Switch {{ sw + 1 }}
                  </span>
                </div>
              </div>
            </div>
          </ng-container>
        </nz-card>
      </ng-container>
    </ng-container>
  </div>
</div>
